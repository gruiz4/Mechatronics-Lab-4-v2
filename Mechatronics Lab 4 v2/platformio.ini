[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
	adafruit/Adafruit BNO055@^1.6.4
	pololu/DualMAX14870MotorShield@^2.0.0
    qub1750ul/SharpIR@^2.0.1
	arduino12/pixy2@^1.0.4
    
